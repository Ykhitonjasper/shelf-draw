name: Shelf Draw
options:
  bundleIdPrefix: com.shelfdraw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: "Shelf Draw/Info.plist"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.shelfdraw.ShelfDraw
    PRODUCT_NAME: Shelf Draw
    PRODUCT_MODULE_NAME: ShelfDraw
    DEVELOPMENT_TEAM: "TPUZ93XTJ6"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MACCATALYST: NO
targets:
  "Shelf Draw":
    type: application
    platform: iOS
    sources:
      - path: "Shelf Draw"
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
    resources:
      - path: "Shelf Draw/Assets.xcassets"
      - path: "Shelf Draw/PrivacyInfo.xcprivacy"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Shelf Draw
        PRODUCT_BUNDLE_IDENTIFIER: com.shelfdraw.ShelfDraw
        PRODUCT_NAME: Shelf Draw
        PRODUCT_MODULE_NAME: ShelfDraw
        PRODUCT_DISPLAY_NAME: Shelf Draw
        CODE_SIGN_ENTITLEMENTS: "Config/Shelf Draw.entitlements"
        DEVELOPMENT_TEAM: "TPUZ93XTJ6"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  "Shelf DrawUITests":
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: "Shelf DrawUITests"
    dependencies:
      - target: "Shelf Draw"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.shelfdraw.ShelfDraw.uitests
        PRODUCT_NAME: "Shelf DrawUITests"
        PRODUCT_MODULE_NAME: ShelfDrawUITests
        DEVELOPMENT_TEAM: "TPUZ93XTJ6"
        TEST_TARGET_NAME: "Shelf Draw"
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  "Shelf Draw":
    build:
      targets:
        "Shelf Draw": all
        "Shelf DrawUITests": [test]
    test:
      targets:
        - "Shelf DrawUITests"
